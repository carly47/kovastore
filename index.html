<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOVA Essentials · Catálogo</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --muted: #888;
      --accent: #c9a84c;
      --green: #25d366;
      --danger: #e74c3c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.4;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      text-align: center;
      flex: 1;
    }
    .logo h1 {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 6px;
      color: #fff;
    }
    .logo span {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 4px;
      color: var(--muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .currency-toggle {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .currency-toggle button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 8px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .currency-toggle button.active {
      background: var(--accent);
      color: #111;
    }

    .cart-btn {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      width: 44px;
      height: 44px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cart-count {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--accent);
      color: #111;
      font-size: 0.7rem;
      font-weight: 700;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 100px;
    }

    .section-title {
      text-align: center;
      margin: 30px 0 20px;
      font-size: 0.9rem;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .section-badge {
      display: inline-block;
      background: #1a1a1a;
      border: 1px solid #333;
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #ccc;
      margin-bottom: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .product-card:hover {
      transform: translateY(-4px);
      border-color: #444;
    }

    .product-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: #111;
      padding: 8px;
    }

    .product-body {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .product-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
    }
    .product-ref {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .product-price {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      margin-top: 4px;
    }

    /* Selector de cantidad con +/- */
    .qty-stepper {
      display: flex;
      align-items: center;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      width: fit-content;
    }
    .qty-stepper button {
      background: transparent;
      border: none;
      color: var(--accent);
      width: 32px;
      height: 32px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .qty-stepper button:hover {
      background: #252525;
    }
    .qty-stepper span {
      padding: 0 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .add-btn {
      width: 100%;
      margin-top: 10px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .add-btn:hover {
      background: var(--accent);
      color: #111;
    }

    /* Modal de Detalle de Perfume */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
      padding: 16px;
    }
    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      background: #121212;
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 550px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
    }
    .close-modal {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.8rem;
      cursor: pointer;
    }
    .modal-img {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      background: #000;
      border-radius: 12px;
      padding: 12px;
    }
    .modal-body {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-title { font-size: 1.3rem; font-weight: 700; color: #fff; }
    .modal-ref { font-size: 0.85rem; color: var(--muted); }
    .modal-desc { font-size: 0.9rem; color: #ccc; line-height: 1.5; }
    .modal-price { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    
    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }
    .buy-now-btn {
      background: var(--accent);
      color: #111;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .add-continue-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Cart */
    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }
    .cart-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .cart-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: min(380px, 100%);
      height: 100%;
      background: #111;
      border-left: 1px solid var(--border);
      z-index: 210;
      transform: translateX(100%);
      transition: transform 0.3s;
      display: flex;
      flex-direction: column;
    }
    .cart-overlay.open .cart-panel {
      transform: translateX(0);
    }

    .cart-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .close-cart {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #222;
      align-items: center;
    }
    .cart-item img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      background: #1a1a1a;
      border-radius: 8px;
    }
    .cart-item-info {
      flex: 1;
    }
    .cart-item-name {
      font-size: 0.85rem;
      font-weight: 600;
    }
    .cart-item-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .cart-item-price {
      font-size: 0.9rem;
      color: var(--accent);
      margin-top: 4px;
    }
    .remove-item {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .cart-footer {
      padding: 16px 20px 24px;
      border-top: 1px solid var(--border);
    }
    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .cart-total span:last-child {
      color: var(--accent);
    }

    .whatsapp-btn {
      width: 100%;
      background: var(--green);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .whatsapp-btn:hover {
      background: #1ebe57;
    }
    .whatsapp-btn:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }

    .empty-cart {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
      font-size: 0.95rem;
    }

    .disclaimer {
      text-align: center;
      font-size: 0.7rem;
      color: #555;
      margin-top: 40px;
      padding: 0 20px;
    }

    @media (max-width: 600px) {
      .logo h1 { font-size: 1.4rem; letter-spacing: 3px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .product-body { padding: 10px; }
      .product-name { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <h1>KOVA</h1>
    <span>ESSENTIALS</span>
  </div>
  <div class="header-actions">
    <div class="currency-toggle">
      <button id="btn-usd" class="active" onclick="setCurrency('USD')">USD</button>
      <button id="btn-eur" onclick="setCurrency('EUR')">EUR</button>
      <button id="btn-cup" onclick="setCurrency('CUP')">CUP</button>
    </div>
    <button class="cart-btn" onclick="openCart()">
      🛒
      <span class="cart-count" id="cart-count">0</span>
    </button>
  </div>
</header>

<main>
  <div class="section-title">
    <div class="section-badge">20 ml</div>
    <div>Fragancias · Presentación 20 ml</div>
  </div>
  <div class="grid" id="grid-20"></div>

  <div class="section-title" style="margin-top:50px">
    <div class="section-badge">50 ml</div>
    <div>Fragancias · Presentación 50 ml</div>
  </div>
  <div class="grid" id="grid-50"></div>

  <p class="disclaimer">
    Los productos mostrados son fragancias de inspiración; las marcas mencionadas se utilizan únicamente para identificar la referencia olfativa.
  </p>
</main>

<!-- Modal de Detalle de Producto -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <button class="close-modal" onclick="closeModal()">&times;</button>
    <img id="modal-img" class="modal-img" src="" alt="" />
    <div class="modal-body">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-ref" class="modal-ref"></div>
      <div id="modal-desc" class="modal-desc"></div>
      <div id="modal-price" class="modal-price"></div>
      
      <div class="qty-stepper" style="margin-top: 6px;">
        <button onclick="adjustModalQty(-1)">-</button>
        <span id="modal-qty">1</span>
        <button onclick="adjustModalQty(1)">+</button>
      </div>

      <div class="modal-actions">
        <button class="buy-now-btn" onclick="buyNowFromModal()">Comprar Ya</button>
        <button class="add-continue-btn" onclick="addFromModal()">Añadir y seguir explorando</button>
      </div>
    </div>
  </div>
</div>

<!-- Cart -->
<div class="cart-overlay" id="cart-overlay" onclick="closeCart(event)">
  <div class="cart-panel" onclick="event.stopPropagation()">
    <div class="cart-header">
      <h2>Tu pedido</h2>
      <button class="close-cart" onclick="closeCart()">&times;</button>
    </div>
    <div class="cart-items" id="cart-items">
      <div class="empty-cart">El carrito está vacío</div>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total</span>
        <span id="cart-total">$0</span>
      </div>
      <button class="whatsapp-btn" id="wa-btn" disabled onclick="sendOrder()">
        <span>📱</span> Pedir por WhatsApp
      </button>
    </div>
  </div>
</div>

<script>
  // ========== CONFIGURACIÓN ==========
  const WHATSAPP_NUMBER = "5355360008";
  const RATE_CUP = 740;  // 1 USD = 740 CUP
  const RATE_EUR_CUP = 840; // 1 EUR = 840 CUP (Tasa directa)
  const USD_TO_EUR = RATE_CUP / RATE_EUR_CUP; // Conversión USD a EUR

  const products = [
    // 20 ml
    { id: 1,  name: "1 Million",                    ref: "Gold Digger",           size: "20 ml", priceUSD: 18, img: "img/img-002.png", desc: "Una fragancia audaz con notas amaderadas y toques de cuero y especias, perfecta para destacar en la noche." },
    { id: 2,  name: "Tom Ford F'n Fabulous",         ref: "F'n Marvelous",         size: "20 ml", priceUSD: 22, img: "img/img-003.png", desc: "Un aroma cuero-oriental sofisticado y exclusivo, enriquecido con almendra amarga y haba tonka." },
    { id: 3,  name: "Sauvage Elixir",                ref: "Savage Spell",          size: "20 ml", priceUSD: 20, img: "img/img-004.png", desc: "Concentración extraordinaria de notas especiadas, lavanda fresca y un fondo de maderas ricas." },
    { id: 4,  name: "Christian Clive Blonde Amber",  ref: "Goldie Luxe",           size: "20 ml", priceUSD: 25, img: "img/goldie_luxe.jpg", desc: "Ámbar cálido, notas frutales y un toque de ron que evocan elegancia atemporal." },
    { id: 5,  name: "Creed Queen of Silk",           ref: "Sew Over You",          size: "20 ml", priceUSD: 24, img: "img/sew_over_you.jpg", desc: "Una esencia envolvente con flores blancas, vainilla suave y notas amaderadas delicadas." },
    { id: 6,  name: "YSL Libre",                     ref: "Libre-Ate Me",          size: "20 ml", priceUSD: 19, img: "img/img-005.png", desc: "El equilibrio perfecto entre la lavanda francesa y la flor de azahar marroquí." },
    { id: 7,  name: "JPG Le Male Elixir",            ref: "Alpha Elixir",          size: "20 ml", priceUSD: 18, img: "img/alpha_elixir.jpg", desc: "Intenso y sensual con notas dulces de haba tonka, menta fresca y benjuí." },
    { id: 8,  name: "Tom Ford Electric Cherry",      ref: "Cherry Spark",          size: "20 ml", priceUSD: 23, img: "img/img-006.png", desc: "Cereza ácida combinada con jazmín dulce y pimienta rosada vibrante." },
    { id: 9,  name: "Bleu de Chanel",                ref: "Azure Depth",           size: "20 ml", priceUSD: 20, img: "img/img-007.png", desc: "Una fragancia aromática y amaderada de carácter independiente y elegante." },

    // 50 ml
    { id: 10, name: "Azzaro Most Wanted",            ref: "Wanted Dead or Adored", size: "50 ml", priceUSD: 35, img: "img/img-010.png", desc: "Un aroma amaderado oriental de alta intensidad con cardamomo, toffee y madera de ámbar." },
    { id: 11, name: "YSL Y",                         ref: "Why Not",               size: "50 ml", priceUSD: 32, img: "img/img-011.png", desc: "Aroma fresco y profundo con notas de bergamota, salvia y madera de cedro." },
    { id: 12, name: "JPG Ultra Male",                ref: "Alpha Noir",            size: "50 ml", priceUSD: 34, img: "img/img-012.png", desc: "Una explosión de pera dulce, lavanda negra y vainilla amaderada." },
    { id: 13, name: "Viktor Rolf Spicebomb Extreme", ref: "Spice to Meet You",     size: "50 ml", priceUSD: 33, img: "img/img-013.png", desc: "Combinación explosiva de especias cálidas, comino, canela y tabaco rico." },
    { id: 14, name: "Tom Ford Ombré Leather",        ref: "Leather Late Than Never", size: "50 ml", priceUSD: 38, img: "img/img-014.png", desc: "Cuero texturizado, cardamomo y jazmín que proyectan libertad y profundidad." },
    { id: 15, name: "Born in Roma Intense",          ref: "When in Roma",          size: "50 ml", priceUSD: 36, img: "img/img-015.png", desc: "Un homenaje moderno con notas de vainilla magnética y jazmín solar." },
    { id: 16, name: "YSL Libre",                     ref: "Libre-Ate Me",          size: "50 ml", priceUSD: 34, img: "img/img-016.png", desc: "Presentación de 50 ml de esta fragancia floral y audaz con alta fijación." },
    { id: 17, name: "Ex Nihilo Blue Talisman",       ref: "Ya Blue Me Away",       size: "50 ml", priceUSD: 40, img: "img/img-017.png", desc: "Pera, bergamota, flor de azahar y maderas que crean un amuleto olfativo único." },
    { id: 18, name: "Acqua di Giò Profumo",          ref: "Holy Ship You Clean Up Nice", size: "50 ml", priceUSD: 35, img: "img/holy_ship.jpg", desc: "Frescura marina combinada con la profundidad del incienso y el pachulí." },
  ];

  let currency = "USD";
  let cart = [];
  let tempQuantities = {}; 
  let currentModalProductId = null;
  let currentModalQty = 1;

  function formatPrice(usd) {
    if (currency === "USD") {
      return "$" + usd.toFixed(2);
    } else if (currency === "EUR") {
      return "€" + (usd * USD_TO_EUR).toFixed(2);
    } else {
      return (usd * RATE_CUP).toLocaleString("es-CU") + " CUP";
    }
  }

  function renderProducts() {
    const grid20 = document.getElementById("grid-20");
    const grid50 = document.getElementById("grid-50");
    grid20.innerHTML = "";
    grid50.innerHTML = "";

    products.forEach(p => {
      if (!tempQuantities[p.id]) tempQuantities[p.id] = 1;

      const card = document.createElement("div");
      card.className = "product-card";
      card.onclick = () => openModal(p.id);

      card.innerHTML = `
        <img class="product-img" src="${p.img}" alt="${p.name}" loading="lazy" />
        <div class="product-body">
          <div class="product-name">${p.name}</div>
          <div class="product-ref">${p.ref} · ${p.size}</div>
          <div class="product-price">${formatPrice(p.priceUSD)}</div>
          
          <div class="qty-stepper" onclick="event.stopPropagation()">
            <button onclick="changeCardQty(${p.id}, -1)">-</button>
            <span id="qty-val-${p.id}">${tempQuantities[p.id]}</span>
            <button onclick="changeCardQty(${p.id}, 1)">+</button>
          </div>

          <button class="add-btn" onclick="event.stopPropagation(); addToCart(${p.id})">Agregar al carrito</button>
        </div>
      `;
      if (p.size === "20 ml") grid20.appendChild(card);
      else grid50.appendChild(card);
    });
  }

  function changeCardQty(id, delta) {
    tempQuantities[id] = Math.max(1, (tempQuantities[id] || 1) + delta);
    document.getElementById(`qty-val-${id}`).textContent = tempQuantities[id];
  }

  // ========== MODAL FUNCTIONS ==========
  function openModal(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;

    currentModalProductId = id;
    currentModalQty = tempQuantities[id] || 1;

    document.getElementById("modal-img").src = p.img;
    document.getElementById("modal-title").textContent = p.name;
    document.getElementById("modal-ref").textContent = `${p.ref} · ${p.size}`;
    document.getElementById("modal-desc").textContent = p.desc;
    document.getElementById("modal-price").textContent = formatPrice(p.priceUSD);
    document.getElementById("modal-qty").textContent = currentModalQty;

    document.getElementById("modal-overlay").classList.add("open");
  }

  function closeModal(e) {
    if (!e || e.target.id === "modal-overlay") {
      document.getElementById("modal-overlay").classList.remove("open");
    }
  }

  function adjustModalQty(delta) {
    currentModalQty = Math.max(1, currentModalQty + delta);
    document.getElementById("modal-qty").textContent = currentModalQty;
  }

  function addFromModal() {
    if (currentModalProductId) {
      tempQuantities[currentModalProductId] = currentModalQty;
      addToCart(currentModalProductId);
      closeModal();
    }
  }

  function buyNowFromModal() {
    if (currentModalProductId) {
      tempQuantities[currentModalProductId] = currentModalQty;
      addToCart(currentModalProductId);
      closeModal();
      openCart();
    }
  }

  // ========== CART FUNCTIONS ==========
  function addToCart(id) {
    const qty = tempQuantities[id] || 1;
    const existing = cart.find(i => i.id === id);

    if (existing) {
      existing.qty += qty;
    } else {
      cart.push({ id, qty });
    }
    
    // Resetear temporal
    tempQuantities[id] = 1;
    renderProducts();

    updateCartUI();
  }

  function updateCartItemQty(id, delta) {
    const item = cart.find(i => i.id === id);
    if (item) {
      item.qty += delta;
      if (item.qty <= 0) {
        removeFromCart(id);
      } else {
        updateCartUI();
      }
    }
  }

  function removeFromCart(id) {
    cart = cart.filter(i => i.id !== id);
    updateCartUI();
  }

  function updateCartUI() {
    const countEl = document.getElementById("cart-count");
    const itemsEl = document.getElementById("cart-items");
    const totalEl = document.getElementById("cart-total");
    const waBtn = document.getElementById("wa-btn");

    const totalQty = cart.reduce((s, i) => s + i.qty, 0);
    countEl.textContent = totalQty;

    if (cart.length === 0) {
      itemsEl.innerHTML = '<div class="empty-cart">El carrito está vacío</div>';
      totalEl.textContent = formatPrice(0);
      waBtn.disabled = true;
      return;
    }

    let total = 0;
    itemsEl.innerHTML = cart.map(item => {
      const p = products.find(x => x.id === item.id);
      const sub = p.priceUSD * item.qty;
      total += sub;
      return `
        <div class="cart-item">
          <img src="${p.img}" alt="${p.name}" />
          <div class="cart-item-info">
            <div class="cart-item-name">${p.name}</div>
            <div class="cart-item-meta">${p.size}</div>
            <div class="cart-item-price">${formatPrice(sub)}</div>
            <button class="remove-item" onclick="removeFromCart(${p.id})">Eliminar</button>
          </div>
          <div class="qty-stepper">
            <button onclick="updateCartItemQty(${p.id}, -1)">-</button>
            <span>${item.qty}</span>
            <button onclick="updateCartItemQty(${p.id}, 1)">+</button>
          </div>
        </div>
      `;
    }).join("");

    totalEl.textContent = formatPrice(total);
    waBtn.disabled = false;
  }

  function openCart() {
    document.getElementById("cart-overlay").classList.add("open");
  }

  function closeCart(e) {
    if (!e || e.target.id === "cart-overlay") {
      document.getElementById("cart-overlay").classList.remove("open");
    }
  }

  function setCurrency(cur) {
    currency = cur;
    document.getElementById("btn-usd").classList.toggle("active", cur === "USD");
    document.getElementById("btn-eur").classList.toggle("active", cur === "EUR");
    document.getElementById("btn-cup").classList.toggle("active", cur === "CUP");
    
    renderProducts();
    updateCartUI();

    if (currentModalProductId) {
      const p = products.find(x => x.id === currentModalProductId);
      document.getElementById("modal-price").textContent = formatPrice(p.priceUSD);
    }
  }

  function sendOrder() {
    if (cart.length === 0) return;

    let msg = "¡Hola! Quiero hacer el siguiente pedido de *KOVA Essentials*:%0A%0A";
    let totalUSD = 0;

    cart.forEach(item => {
      const p = products.find(x => x.id === item.id);
      const sub = p.priceUSD * item.qty;
      totalUSD += sub;
      msg += `• *${p.name}* (${p.size}) x${item.qty} — ${formatPrice(sub)}%0A`;
    });

    msg += `%0A*Total: ${formatPrice(totalUSD)}*`;
    msg += `%0AMoneda seleccionada: ${currency}`;
    msg += "%0A%0A¿Me confirmas disponibilidad y forma de pago?";

    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
    window.open(url, "_blank");
  }

  renderProducts();
  updateCartUI();
</script>
</body>
</html>
