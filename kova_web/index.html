<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOVA Essentials · Catálogo</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --muted: #888;
      --accent: #c9a84c;
      --green: #25d366;
      --danger: #e74c3c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.4;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      text-align: center;
      flex: 1;
    }
    .logo h1 {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 6px;
      color: #fff;
    }
    .logo span {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 4px;
      color: var(--muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Currency toggle */
    .currency-toggle {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .currency-toggle button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .currency-toggle button.active {
      background: var(--accent);
      color: #111;
    }

    /* Cart button */
    .cart-btn {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      width: 44px;
      height: 44px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cart-count {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--accent);
      color: #111;
      font-size: 0.7rem;
      font-weight: 700;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Main */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 100px;
    }

    .section-title {
      text-align: center;
      margin: 30px 0 20px;
      font-size: 0.9rem;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .section-badge {
      display: inline-block;
      background: #1a1a1a;
      border: 1px solid #333;
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #ccc;
      margin-bottom: 8px;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-4px);
      border-color: #444;
    }

    .product-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: #111;
      padding: 8px;
    }

    .product-body {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .product-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
    }
    .product-ref {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .product-price {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      margin-top: 4px;
    }

    .qty-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .qty-row label {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .qty-input {
      width: 60px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      padding: 6px 8px;
      text-align: center;
      font-size: 0.9rem;
    }

    .add-btn {
      width: 100%;
      margin-top: 10px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .add-btn:hover {
      background: var(--accent);
      color: #111;
    }

    /* Cart sidebar */
    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }
    .cart-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .cart-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: min(380px, 100%);
      height: 100%;
      background: #111;
      border-left: 1px solid var(--border);
      z-index: 210;
      transform: translateX(100%);
      transition: transform 0.3s;
      display: flex;
      flex-direction: column;
    }
    .cart-overlay.open .cart-panel {
      transform: translateX(0);
    }

    .cart-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .close-cart {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #222;
    }
    .cart-item img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      background: #1a1a1a;
      border-radius: 8px;
    }
    .cart-item-info {
      flex: 1;
    }
    .cart-item-name {
      font-size: 0.85rem;
      font-weight: 600;
    }
    .cart-item-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .cart-item-price {
      font-size: 0.9rem;
      color: var(--accent);
      margin-top: 4px;
    }
    .remove-item {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .cart-footer {
      padding: 16px 20px 24px;
      border-top: 1px solid var(--border);
    }
    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .cart-total span:last-child {
      color: var(--accent);
    }

    .whatsapp-btn {
      width: 100%;
      background: var(--green);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .whatsapp-btn:hover {
      background: #1ebe57;
    }
    .whatsapp-btn:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }

    .empty-cart {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
      font-size: 0.95rem;
    }

    /* Footer note */
    .disclaimer {
      text-align: center;
      font-size: 0.7rem;
      color: #555;
      margin-top: 40px;
      padding: 0 20px;
    }

    @media (max-width: 600px) {
      .logo h1 { font-size: 1.4rem; letter-spacing: 3px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .product-body { padding: 10px; }
      .product-name { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <h1>KOVA</h1>
    <span>ESSENTIALS</span>
  </div>
  <div class="header-actions">
    <div class="currency-toggle">
      <button id="btn-usd" class="active" onclick="setCurrency('USD')">USD</button>
      <button id="btn-cup" onclick="setCurrency('CUP')">CUP</button>
    </div>
    <button class="cart-btn" onclick="openCart()">
      🛒
      <span class="cart-count" id="cart-count">0</span>
    </button>
  </div>
</header>

<main>
  <div class="section-title">
    <div class="section-badge">20 ml</div>
    <div>Fragancias · Presentación 20 ml</div>
  </div>
  <div class="grid" id="grid-20"></div>

  <div class="section-title" style="margin-top:50px">
    <div class="section-badge">50 ml</div>
    <div>Fragancias · Presentación 50 ml</div>
  </div>
  <div class="grid" id="grid-50"></div>

  <p class="disclaimer">
    Los productos mostrados son fragancias de inspiración; las marcas mencionadas se utilizan únicamente para identificar la referencia olfativa.
  </p>
</main>

<!-- Cart -->
<div class="cart-overlay" id="cart-overlay" onclick="closeCart(event)">
  <div class="cart-panel" onclick="event.stopPropagation()">
    <div class="cart-header">
      <h2>Tu pedido</h2>
      <button class="close-cart" onclick="closeCart()">&times;</button>
    </div>
    <div class="cart-items" id="cart-items">
      <div class="empty-cart">El carrito está vacío</div>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total</span>
        <span id="cart-total">$0</span>
      </div>
      <button class="whatsapp-btn" id="wa-btn" disabled onclick="sendOrder()">
        <span>📱</span> Pedir por WhatsApp
      </button>
    </div>
  </div>
</div>

<script>
  // ========== CONFIGURACIÓN ==========
  // Cambia este número por el de WhatsApp real (código de país + número, sin + ni espacios)
  const WHATSAPP_NUMBER = "5355360008";  // <-- PON AQUÍ TU NÚMERO

  // Tasa de cambio aproximada (puedes cambiarla)
  const RATE_CUP = 740; // 1 USD = 740 CUP

  // Productos (precios de ejemplo en USD – cámbialos después)
  const products = [
    // 20 ml
    { id: 1,  name: "1 Million",                    ref: "Gold Digger",           size: "20 ml", priceUSD: 18, img: "img/img-002.png" },
    { id: 2,  name: "Tom Ford F'n Fabulous",         ref: "F'n Marvelous",         size: "20 ml", priceUSD: 22, img: "img/img-003.png" },
    { id: 3,  name: "Sauvage Elixir",                ref: "Savage Spell",          size: "20 ml", priceUSD: 20, img: "img/img-004.png" },
    { id: 4,  name: "Christian Clive Blonde Amber",  ref: "Goldie Luxe",           size: "20 ml", priceUSD: 25, img: "img/goldie_luxe.jpg" },
    { id: 5,  name: "Creed Queen of Silk",           ref: "Sew Over You",          size: "20 ml", priceUSD: 24, img: "img/sew_over_you.jpg" },
    { id: 6,  name: "YSL Libre",                     ref: "Libre-Ate Me",          size: "20 ml", priceUSD: 19, img: "img/img-005.png" },
    { id: 7,  name: "JPG Le Male Elixir",            ref: "Alpha Elixir",          size: "20 ml", priceUSD: 18, img: "img/alpha_elixir.jpg" },
    { id: 8,  name: "Tom Ford Electric Cherry",      ref: "Cherry Spark",          size: "20 ml", priceUSD: 23, img: "img/img-006.png" },
    { id: 9,  name: "Bleu de Chanel",                ref: "Azure Depth",           size: "20 ml", priceUSD: 20, img: "img/img-007.png" },

    // 50 ml
    { id: 10, name: "Azzaro Most Wanted",            ref: "Wanted Dead or Adored", size: "50 ml", priceUSD: 35, img: "img/img-010.png" },
    { id: 11, name: "YSL Y",                         ref: "Why Not",               size: "50 ml", priceUSD: 32, img: "img/img-011.png" },
    { id: 12, name: "JPG Ultra Male",                ref: "Alpha Noir",            size: "50 ml", priceUSD: 34, img: "img/img-012.png" },
    { id: 13, name: "Viktor Rolf Spicebomb Extreme", ref: "Spice to Meet You",     size: "50 ml", priceUSD: 33, img: "img/img-013.png" },
    { id: 14, name: "Tom Ford Ombré Leather",        ref: "Leather Late Than Never", size: "50 ml", priceUSD: 38, img: "img/img-014.png" },
    { id: 15, name: "Born in Roma Intense",          ref: "When in Roma",          size: "50 ml", priceUSD: 36, img: "img/img-015.png" },
    { id: 16, name: "YSL Libre",                     ref: "Libre-Ate Me",          size: "50 ml", priceUSD: 34, img: "img/img-016.png" },
    { id: 17, name: "Ex Nihilo Blue Talisman",       ref: "Ya Blue Me Away",       size: "50 ml", priceUSD: 40, img: "img/img-017.png" },
    { id: 18, name: "Acqua di Giò Profumo",          ref: "Holy Ship You Clean Up Nice", size: "50 ml", priceUSD: 35, img: "img/holy_ship.jpg" },
  ];

  // ========== STATE ==========
  let currency = "USD";
  let cart = []; // { id, qty }

  // ========== HELPERS ==========
  function formatPrice(usd) {
    if (currency === "USD") {
      return "$" + usd.toFixed(2);
    } else {
      return (usd * RATE_CUP).toLocaleString("es-CU") + " CUP";
    }
  }

  function getPrice(p) {
    return currency === "USD" ? p.priceUSD : p.priceUSD * RATE_CUP;
  }

  // ========== RENDER PRODUCTS ==========
  function renderProducts() {
    const grid20 = document.getElementById("grid-20");
    const grid50 = document.getElementById("grid-50");
    grid20.innerHTML = "";
    grid50.innerHTML = "";

    products.forEach(p => {
      const card = document.createElement("div");
      card.className = "product-card";
      card.innerHTML = `
        <img class="product-img" src="${p.img}" alt="${p.name}" loading="lazy" />
        <div class="product-body">
          <div class="product-name">${p.name}</div>
          <div class="product-ref">${p.ref} · ${p.size}</div>
          <div class="product-price">${formatPrice(p.priceUSD)}</div>
          <div class="qty-row">
            <label>Cant:</label>
            <input type="number" class="qty-input" id="qty-${p.id}" min="1" value="1" />
          </div>
          <button class="add-btn" onclick="addToCart(${p.id})">Agregar al carrito</button>
        </div>
      `;
      if (p.size === "20 ml") grid20.appendChild(card);
      else grid50.appendChild(card);
    });
  }

  // ========== CART ==========
  function addToCart(id) {
    const qtyInput = document.getElementById(`qty-${id}`);
    const qty = Math.max(1, parseInt(qtyInput.value) || 1);

    const existing = cart.find(i => i.id === id);
    if (existing) {
      existing.qty += qty;
    } else {
      cart.push({ id, qty });
    }
    updateCartUI();
    openCart();
  }

  function removeFromCart(id) {
    cart = cart.filter(i => i.id !== id);
    updateCartUI();
  }

  function updateCartUI() {
    const countEl = document.getElementById("cart-count");
    const itemsEl = document.getElementById("cart-items");
    const totalEl = document.getElementById("cart-total");
    const waBtn = document.getElementById("wa-btn");

    const totalQty = cart.reduce((s, i) => s + i.qty, 0);
    countEl.textContent = totalQty;

    if (cart.length === 0) {
      itemsEl.innerHTML = '<div class="empty-cart">El carrito está vacío</div>';
      totalEl.textContent = formatPrice(0);
      waBtn.disabled = true;
      return;
    }

    let total = 0;
    itemsEl.innerHTML = cart.map(item => {
      const p = products.find(x => x.id === item.id);
      const sub = p.priceUSD * item.qty;
      total += sub;
      return `
        <div class="cart-item">
          <img src="${p.img}" alt="${p.name}" />
          <div class="cart-item-info">
            <div class="cart-item-name">${p.name}</div>
            <div class="cart-item-meta">${p.size} × ${item.qty}</div>
            <div class="cart-item-price">${formatPrice(sub)}</div>
            <button class="remove-item" onclick="removeFromCart(${p.id})">Eliminar</button>
          </div>
        </div>
      `;
    }).join("");

    totalEl.textContent = formatPrice(total);
    waBtn.disabled = false;
  }

  function openCart() {
    document.getElementById("cart-overlay").classList.add("open");
  }
  function closeCart(e) {
    if (!e || e.target.id === "cart-overlay") {
      document.getElementById("cart-overlay").classList.remove("open");
    }
  }

  // ========== CURRENCY ==========
  function setCurrency(cur) {
    currency = cur;
    document.getElementById("btn-usd").classList.toggle("active", cur === "USD");
    document.getElementById("btn-cup").classList.toggle("active", cur === "CUP");
    renderProducts();
    updateCartUI();
  }

  // ========== WHATSAPP ORDER ==========
  function sendOrder() {
    if (cart.length === 0) return;

    let msg = "¡Hola! Quiero hacer el siguiente pedido de *KOVA Essentials*:%0A%0A";
    let totalUSD = 0;

    cart.forEach(item => {
      const p = products.find(x => x.id === item.id);
      const sub = p.priceUSD * item.qty;
      totalUSD += sub;
      msg += `• *${p.name}* (${p.size}) x${item.qty} — ${formatPrice(sub)}%0A`;
    });

    msg += `%0A*Total: ${formatPrice(totalUSD)}*`;
    msg += `%0AMoneda seleccionada: ${currency}`;
    msg += "%0A%0A¿Me confirmas disponibilidad y forma de pago?";

    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
    window.open(url, "_blank");
  }

  // Init
  renderProducts();
  updateCartUI();
</script>
</body>
</html>
EOF
